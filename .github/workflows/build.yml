name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（x.y.z）'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Inno Setup 6（编译安装包用）
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 未安装成功：$iscc 不存在" }
          "ISCC = $iscc" >> $env:GITHUB_STEP_SUMMARY

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "版本号格式不对：$v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 构建发布包（exe + 绿色版 zip + 安装包 + SHA256SUMS）
        shell: pwsh
        run: |
          ./build.ps1 -Release -NoDeploy -Version ${{ steps.ver.outputs.version }} -ReleaseDir "$env:RUNNER_TEMP\release"

      - name: 显示产物
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\release" -Recurse -File |
            Select-Object FullName, @{n='KB';e={[math]::Round($_.Length/1KB,1)}} |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: WinLaunch-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/release/**

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WinLaunch ${{ steps.ver.outputs.version }}
          body_path: docs/发布说明.md
          draft: true
          files: |
            ${{ runner.temp }}/release/**/*.exe
            ${{ runner.temp }}/release/**/*.zip
            ${{ runner.temp }}/release/**/SHA256SUMS.txt
